name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "shared/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-backend.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            cd "${{ secrets.VPS_APP_PATH }}"
            git pull --ff-only
            npm ci
            npm run build
            npm run migrate
            pm2 restart growloop-backend || pm2 start backend/dist/src/server.js --name growloop-backend
